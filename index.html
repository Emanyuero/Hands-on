<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax Syndicate</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #00ff99;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            overflow: hidden;
        }
        
        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }
        
        h1::before, h1::after {
            content: "Hello World";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            color: #ff0066;
            z-index: -1;
            animation: glitch 1s infinite;
        }
        
        @keyframes glitch {
            0% { transform: translateX(-2px); }
            25% { transform: translateX(2px); }
            50% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
            100% { transform: translateX(-2px); }
        }
        
        .terminal {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            display: inline-block;
            border-radius: 10px;
            border: 2px solid #00ff99;
            margin-top: 20px;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    
    <div class="terminal">
        <p>Initializing Syntax Syndicate...</p>
        <p>Access Granted. <span class="blink">█</span></p>
    </div>
</body>
</html>
